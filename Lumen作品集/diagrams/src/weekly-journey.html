<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#F7F1E8;color:#18151A}.canvas{width:1240px;min-height:760px;background:radial-gradient(circle at 84% 8%,rgba(216,161,94,.13),transparent 28%),linear-gradient(135deg,#FBF5EC,#EFE2D4);padding:54px 58px 46px}.head{display:flex;justify-content:space-between;gap:30px;align-items:flex-end;border-bottom:1px solid rgba(33,30,37,.12);padding-bottom:24px}.kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#A36F3A}.title{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:44px;letter-spacing:-.04em;margin-top:8px}.sub{max-width:520px;font-size:15px;line-height:1.65;color:#6F655E}.grid{display:grid;gap:14px;margin-top:24px}.card{background:rgba(255,253,248,.72);border:1px solid rgba(33,30,37,.08);border-radius:20px;padding:20px;box-shadow:0 14px 36px rgba(70,50,30,.07)}.card h3{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:18px;font-weight:500}.card p,.card li{font-size:13px;line-height:1.58;color:#665D57}.card ul{padding-left:16px;margin-top:8px}.tag{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:99px;background:rgba(216,161,94,.14);color:#8D5D31;font-size:11px}.node{border-radius:18px;background:#FFFDF8;border:1px solid rgba(33,30,37,.1);padding:16px;text-align:center;box-shadow:0 10px 26px rgba(70,50,30,.06)}.node b{display:block;font-size:14px}.node span{display:block;font-size:11px;color:#81766D;margin-top:5px}.arrow{color:#B79B7D;font-size:24px;display:flex;align-items:center;justify-content:center}.footer{display:flex;justify-content:space-between;margin-top:22px;color:#9B8C80;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
</style></head><body><div class="canvas" style="height:720px"><div class="head"><div><div class="kicker">Lumen · Evidence</div><div class="title">一周睡眠旅程</div></div><div class="sub">每天不是打卡，而是产品动作、用户感受与系统学习共同推进。</div></div><div class="grid" style="grid-template-columns:repeat(7,1fr)"><div class="node"><span>第01夜</span><b>看见你的夜</b><span>只记录，不改变</span><span style="color:#A36F3A;margin-top:10px">被接纳</span></div><div class="node"><span>第02夜</span><b>夜晚从哪里开始</b><span>找到最后一小时</span><span style="color:#A36F3A;margin-top:10px">觉察</span></div><div class="node"><span>第03夜</span><b>让身体先安静</b><span>身体扫描</span><span style="color:#A36F3A;margin-top:10px">放松</span></div><div class="node"><span>第04夜</span><b>替代，而不是禁止</b><span>声音或梦境</span><span style="color:#A36F3A;margin-top:10px">愿意停留</span></div><div class="node"><span>第05夜</span><b>只提前十五分钟</b><span>调整睡眠窗口</span><span style="color:#A36F3A;margin-top:10px">可控</span></div><div class="node"><span>第06夜</span><b>把独处还给白天</b><span>安排日间自我时间</span><span style="color:#A36F3A;margin-top:10px">满足</span></div><div class="node"><span>第07夜</span><b>七页夜之书</b><span>用户确认摘要</span><span style="color:#A36F3A;margin-top:10px">自我理解</span></div></div><div class="card" style="margin-top:20px"><svg viewBox="0 0 1100 170" style="width:100%;height:170px"><path d="M30 120 C120 125,170 82,250 96 S390 142,470 102 S620 48,700 78 S850 118,930 62 S1040 50,1070 45" fill="none" stroke="#D8A15E" stroke-width="3"/><g fill="#F7F1E8" stroke="#D8A15E" stroke-width="3"><circle cx="30" cy="120" r="7" fill="#F7F1E8"/><circle cx="190" cy="98" r="7" fill="#D8A15E"/><circle cx="350" cy="108" r="7" fill="#D8A15E"/><circle cx="510" cy="95" r="7" fill="#D8A15E"/><circle cx="670" cy="70" r="7" fill="#D8A15E"/><circle cx="830" cy="82" r="7" fill="#D8A15E"/><circle cx="990" cy="62" r="7" fill="#D8A15E"/><circle cx="1070" cy="45" r="7" fill="#D8A15E"/></g></svg><p>情绪曲线从“被接纳”逐渐走向“可控与自我理解”，不展示优劣，只展示变化。</p></div><div class="footer"><span>光合 Lumen · UI/UX Case Study</span><span>Designed for night owls</span></div></div></body></html>
