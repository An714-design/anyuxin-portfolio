<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#F7F1E8;color:#18151A}.canvas{width:1240px;min-height:760px;background:radial-gradient(circle at 84% 8%,rgba(216,161,94,.13),transparent 28%),linear-gradient(135deg,#FBF5EC,#EFE2D4);padding:54px 58px 46px}.head{display:flex;justify-content:space-between;gap:30px;align-items:flex-end;border-bottom:1px solid rgba(33,30,37,.12);padding-bottom:24px}.kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#A36F3A}.title{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:44px;letter-spacing:-.04em;margin-top:8px}.sub{max-width:520px;font-size:15px;line-height:1.65;color:#6F655E}.grid{display:grid;gap:14px;margin-top:24px}.card{background:rgba(255,253,248,.72);border:1px solid rgba(33,30,37,.08);border-radius:20px;padding:20px;box-shadow:0 14px 36px rgba(70,50,30,.07)}.card h3{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:18px;font-weight:500}.card p,.card li{font-size:13px;line-height:1.58;color:#665D57}.card ul{padding-left:16px;margin-top:8px}.tag{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:99px;background:rgba(216,161,94,.14);color:#8D5D31;font-size:11px}.node{border-radius:18px;background:#FFFDF8;border:1px solid rgba(33,30,37,.1);padding:16px;text-align:center;box-shadow:0 10px 26px rgba(70,50,30,.06)}.node b{display:block;font-size:14px}.node span{display:block;font-size:11px;color:#81766D;margin-top:5px}.arrow{color:#B79B7D;font-size:24px;display:flex;align-items:center;justify-content:center}.footer{display:flex;justify-content:space-between;margin-top:22px;color:#9B8C80;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
</style></head><body><div class="canvas" style="height:620px"><div class="head"><div><div class="kicker">Lumen · Evidence</div><div class="title">记忆流向</div></div><div class="sub">默认不保存具体对话，只记住用户确认过的偏好与本周摘要。</div></div><div class="grid" style="grid-template-columns:repeat(7,1fr);align-items:center"><div class="node"><b>今夜表达</b><span>24 小时后消失</span></div><div class="arrow">→</div><div class="node"><b>用户确认</b><span>可修改或删除</span></div><div class="arrow">→</div><div class="node"><b>偏好 / 周摘要</b><span>只保留 1–2 句</span></div><div class="arrow">→</div><div class="node"><b>下周推荐</b><span>不读取完整历史</span></div></div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:22px"><div class="card"><h3>默认不保存具体对话</h3><p>原始语句不会进入长期记忆。用户可以只留今晚，也可以直接说“别记这句”。</p></div><div class="card"><h3>忘记也是权利</h3><p>某夜、某条线索、本周摘要和偏好都能逐项删除，不需要清空全部数据。</p></div></div><div class="footer"><span>光合 Lumen · UI/UX Case Study</span><span>Designed for night owls</span></div></div></body></html>
