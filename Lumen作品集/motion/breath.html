<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#080B16;color:#ECE2C6;overflow:hidden}.scene{position:relative;width:100%;height:100vh;min-height:420px;overflow:hidden;background:linear-gradient(180deg,#202B46,#10162F 48%,#080B16)}

.scene{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 46%,rgba(216,161,94,.14),transparent 32%),linear-gradient(180deg,#151A31,#080B16)}
.orbit{position:relative;width:min(68vw,520px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(236,226,198,.16);display:flex;align-items:center;justify-content:center;animation:breathe 10s cubic-bezier(.22,.61,.36,1) infinite}
.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(236,226,198,.1)}.orbit:before{inset:10%}.orbit:after{inset:22%}
.glow{position:absolute;inset:33%;border-radius:50%;background:radial-gradient(circle,#FFF5D2 0 7%,#D8A15E 31%,rgba(216,161,94,.1) 68%,transparent 75%);box-shadow:0 0 90px rgba(216,161,94,.34);animation:glow 10s cubic-bezier(.22,.61,.36,1) infinite}
.label{position:absolute;text-align:center}.label b{font-family:"Noto Serif SC","Songti SC","STSong",serif;display:block;font-size:52px;font-weight:500}.label span{display:block;font-size:14px;color:rgba(236,226,198,.58);margin-top:10px;letter-spacing:.14em}
.copy{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);text-align:center;width:80%}.copy h1{font-size:28px;font-weight:500}.copy p{font-size:14px;color:rgba(236,226,198,.62);margin-top:10px}
@keyframes breathe{0%{transform:scale(.84);opacity:.66}40%{transform:scale(1);opacity:1}100%{transform:scale(.84);opacity:.66}}
@keyframes glow{0%{transform:scale(.78);opacity:.58}40%{transform:scale(1.08);opacity:1}100%{transform:scale(.78);opacity:.58}}
@media(prefers-reduced-motion:reduce){.orbit,.glow{animation:none}.orbit{transform:scale(.92)}.glow{transform:scale(.94)}}
</style></head><body><div class="scene"><div class="orbit"><div class="glow"></div><div class="label"><b>4s</b><span>吸气 · 6s 呼气</span></div></div><div class="copy"><h1>听一会儿，慢慢呼吸</h1><p>默认陪伴不生成内容，梦境由你主动展开。</p></div></div></body></html>
