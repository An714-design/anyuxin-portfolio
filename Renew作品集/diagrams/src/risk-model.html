<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#F4F0E8;color:#151515}
.canvas{width:1240px;height:760px;padding:54px 58px 44px;background:#F4F0E8;position:relative;overflow:hidden}
.head{display:flex;justify-content:space-between;gap:30px;align-items:flex-end;border-bottom:1px solid rgba(21,21,21,.14);padding-bottom:22px}
.kicker{font-family:"SFMono-Regular","Cascadia Code","Roboto Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#FF5A36}
.title{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:42px;letter-spacing:-.04em;margin-top:7px}.sub{max-width:560px;font-size:14px;line-height:1.6;color:#8B877E}
.grid{display:grid;gap:14px;margin-top:24px}.flowline{display:flex;align-items:center;gap:8px;margin-top:24px}.flowline .node{flex:1;min-width:0}.flowline .arrow{flex:0 0 18px}.card{background:#FFFDF8;border:1px solid rgba(21,21,21,.14);border-radius:18px;padding:18px}
.card h3{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:18px;font-weight:500}.card p,.card li{font-size:13px;line-height:1.55;color:#8B877E}.card ul{padding-left:17px;margin-top:8px}.tag{display:inline-flex;align-items:center;height:25px;padding:0 9px;border-radius:999px;background:rgba(255,90,54,.12);color:#151515;font-size:10px;font-weight:700}.tag.acid{background:rgba(200,244,90,.18);color:#151515}.tag.warn{background:rgba(243,181,68,.18);color:#151515}
.node{min-height:86px;border-radius:16px;background:#FFFDF8;border:1px solid rgba(21,21,21,.14);padding:15px;text-align:center;display:flex;flex-direction:column;justify-content:center}.node b{font-size:15px}.node span{display:block;font-size:11px;color:#8B877E;margin-top:5px}.arrow{font-family:"SFMono-Regular","Cascadia Code","Roboto Mono",monospace;color:#FF5A36;font-size:24px;display:flex;align-items:center;justify-content:center}.footer{position:absolute;left:58px;right:58px;bottom:26px;display:flex;justify-content:space-between;font-family:"SFMono-Regular","Cascadia Code","Roboto Mono",monospace;font-size:10px;color:#8B877E;letter-spacing:.12em;text-transform:uppercase}
.risk{border-radius:16px;padding:18px;min-height:250px;border:1px solid rgba(21,21,21,.14);background:#FFFDF8}.risk.high{border-color:#FF5A36}.risk.mid{border-color:#F3B544}.risk.low{border-color:#C8F45A}.risk b{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:25px;display:block}.risk p{margin-top:8px}.risk ul{margin-top:14px}
</style></head><body><div class="canvas"><div class="head"><div><div class="kicker">Renew · Evidence</div><div class="title">续费风险模型</div></div><div class="sub">风险不是价值判断，而是帮助用户优先处理最紧迫决定。</div></div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="risk high"><span class="tag">高风险</span><b style="margin-top:12px">7 天内</b><p>金额较高、使用频率低或刚刚涨价。</p><ul><li>进入首页最高优先级</li><li>显示原价、现价和生效日期</li><li>提供取消入口</li></ul></div><div class="risk mid"><span class="tag warn">中风险</span><b style="margin-top:12px">30 天内</b><p>需要关注，但不一定马上行动。</p><ul><li>显示在日历中圈</li><li>允许延后提醒</li><li>建议比较使用频率</li></ul></div><div class="risk low"><span class="tag acid">低风险</span><b style="margin-top:12px">已处理</b><p>用户已确认保留、暂停或取消成功。</p><ul><li>不继续打扰</li><li>保留历史来源</li><li>续费日前再次验证</li></ul></div></div><div class="footer"><span>续费侦探 Renew · UI/UX Case Study</span><span>Simulation only</span></div></div></body></html>
